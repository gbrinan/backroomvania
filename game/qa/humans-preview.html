<!doctype html><html lang="ko"><meta charset="utf-8"><title>Human sprite studies</title><style>body{margin:0;background:#101c21;color:#e3d3ae;font:16px system-ui}h1{font:28px Georgia,serif;margin:28px 40px 8px}p{margin:8px 40px;color:#acbeb7}canvas{display:block;image-rendering:pixelated;width:1200px;height:600px}</style><h1>BACKROOMVANIA · HUMAN SPRITES</h1><p>에블린 베일 · 방향별 실루엣 / 무기 / 사람들</p><canvas width="1200" height="600"></canvas><script type="module">
import{human}from'../src/humans.mjs';const c=document.querySelector('canvas').getContext('2d');
const entries=[['정면',{role:'evelyn',facing:Math.PI/2}],['옆면',{role:'evelyn',facing:0}],['뒷면',{role:'evelyn',facing:-Math.PI/2}],['걷기',{role:'evelyn',facing:Math.PI/2,moving:true}],['검',{role:'evelyn',facing:0,armed:true,weapon:0}],['리볼버',{role:'evelyn',facing:0,armed:true,weapon:1}],['유물 지팡이',{role:'evelyn',facing:0,armed:true,weapon:2}],['기록관장',{role:'director'}],['아르센 루팡',{role:'lupin'}],['빌리 더 키드',{role:'billy'}],['흰 수집가',{role:'collector'}],['가면 쓴 잭',{role:'jack'}]];
function frame(t){c.fillStyle='#101c21';c.fillRect(0,0,1200,600);entries.forEach(([label,a],i)=>{const col=i%6,row=Math.floor(i/6);c.save();c.translate(100+col*200,220+row*280);c.strokeStyle='#2c4347';c.strokeRect(-85,-200,170,235);c.scale(2.4,2.4);human(c,{...a,x:0,y:0,walk:t/100},t/1000);c.restore();c.font='14px system-ui';c.textAlign='center';c.fillStyle='#e3d3ae';c.fillText(label,100+col*200,260+row*280);});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
